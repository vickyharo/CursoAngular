<!-- Cambio de monto linea -->
<div class="flex-1 min-h-0 p-4 rounded-lg border border-bansi-gris-claro">
  <h2 class="text-left text-xl font-bold text-bansi-azul">Cambio de Monto Autorizado de la Línea de Crédito</h2>

  <!-- Fila 1 -->
  <div class="row g-3">
    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Monto Autorizado Original</mat-label>
        <input matInput type="text" readonly [ngModel]="txtMontoOriginal | currency" />
      </mat-form-field>
    </div>
    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nuevo Monto Autorizado:</mat-label>
        <input matInput type="text" disabled="{{tieneSolicitudesPendientes}}" (blur)="TransformarMonto($event)"
          (ngModelChange)="CambioDeMonto($event)" (keypress)="ValidateNumericInput($event)"
          (paste)="AllowPasteOnlyNumbers($event)" [(ngModel)]="txtNuevoMonto" />
      </mat-form-field>
    </div>
  </div>
</div>
