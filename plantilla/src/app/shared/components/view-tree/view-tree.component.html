<div class="bg-white rounded max-h-[600px] overflow-y-auto grid grid-cols-12 grid-rows-1 gap-0">
    <!-- Botones generales -->
    <div class="flex flex-col items-center gap-2 border-r border-gray-200 p-1">
        <button (click)="agregarNodo()" class="p-1 rounded hover:bg-gray-100 transition-colors">
            <img src="assets/icons/outline/plus.svg" class="h-5 w-5" alt="Agregar" />
        </button>
        <button (click)="copiarNodo()" class="p-1 rounded hover:bg-gray-100 transition-colors">
            <img src="assets/icons/outline/document-duplicate.svg" class="h-5 w-5" alt="Copiar" />
        </button>
        <button (click)="pegarNodo()" class="p-1 rounded hover:bg-gray-100 transition-colors">
            <img src="assets/icons/outline/clipboard.svg" class="h-5 w-5" alt="Pegar" />
        </button>
        <button (click)="borrarNodo()" class="p-1 rounded hover:bg-gray-100 transition-colors">
            <img src="assets/icons/outline/trash.svg" class="h-5 w-5" alt="Borrar" />
        </button>
        <button (click)="moverNodoArriba()" class="p-1 rounded hover:bg-gray-100 transition-colors">
            <img src="assets/icons/outline/arrow-up.svg" class="h-5 w-5" alt="Subir" />
        </button>
        <button (click)="moverNodoAbajo()" class="p-1 rounded hover:bg-gray-100 transition-colors">
            <img src="assets/icons/outline/arrow-down.svg" class="h-5 w-5" alt="Bajar" />
        </button>
    </div>

    <div class="col-span-11 p-2">
        <!-- Estructura de árbol -->
        <ul class="space-y-1">
            <ng-container *ngFor="let nodo of nodes">
                <ng-template [ngTemplateOutlet]="treeNode"
                    [ngTemplateOutletContext]="{ $implicit: nodo, nivel: 0 }"></ng-template>
            </ng-container>
        </ul>

        <!-- Nodo recursivo -->
        <ng-template #treeNode let-nodo let-nivel="nivel">
            <li class="relative pl-4" [class.mt-1]="nivel > 0">
                <div *ngIf="nivel > 0" class="absolute left-0 top-0 bottom-0 border-l border-gray-300 w-px"></div>

                <div class="flex items-center py-1 group relative z-10">
                    <span *ngIf="nivel > 0" class="block w-3 h-px bg-gray-300 mr-1"></span>

                    <button *ngIf="nodo.children?.length" (click)="toggle(nodo)"
                        class="transition-transform duration-200 w-5 text-xs mr-1 focus:outline-none text-gray-500"
                        [class.rotate-90]="nodo.expanded">
                        ▶
                    </button>

                    <ng-container [ngSwitch]="nodo.Nivel">
                        <img *ngSwitchCase="1" src="assets/icons/outline/building-office-2.svg"
                            class="h-5 w-5 mr-1 text-gray-600" />
                        <img *ngSwitchCase="2" src="assets/icons/outline/building-office.svg"
                            class="h-5 w-5 mr-1 text-gray-600" />
                        <img *ngSwitchDefault src="assets/icons/outline/home.svg" class="h-5 w-5 mr-1 text-gray-600" />
                    </ng-container>

                    <span class="cursor-pointer px-2 py-1 rounded hover:bg-blue-200 transition-colors"
                        [class.bg-blue-100]="nodo === selectedNode" [class.text-blue-600]="nodo === selectedNode"
                        [class.font-semibold]="nodo === selectedNode" (click)="seleccionarNodo(nodo)">
                        {{ nodo.Descripcion }}
                    </span>
                </div>

                <ul *ngIf="nodo.expanded && nodo.children?.length" class="pl-4 space-y-1">
                    <ng-container *ngFor="let hijo of nodo.children">
                        <ng-template [ngTemplateOutlet]="treeNode"
                            [ngTemplateOutletContext]="{ $implicit: hijo, nivel: nivel + 1 }"></ng-template>
                    </ng-container>
                </ul>
            </li>
        </ng-template>
    </div>
</div>
