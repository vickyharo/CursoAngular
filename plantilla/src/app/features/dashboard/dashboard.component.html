<div class="mb-3">

    <!-- Título -->
    <h1 class="display-6 fw-bold text-dark">Panel Principal</h1>

    <!-- Tarjetas resumen -->
    <div class="row g-2 mt-2">
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card p-2 d-flex flex-row align-items-center">
                <img src="assets/icons/outline/home.svg" class="me-2" style="width: 24px; height: 24px;" alt="Icono">
                <div>
                    <p class="small text-muted mb-0">Inmuebles registrados</p>
                    <p class="h5 fw-bold mb-0">34</p>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <div class="card p-2 d-flex flex-row align-items-center">
                <img src="assets/icons/outline/document-text.svg" class="me-2" style="width: 24px; height: 24px;"
                    alt="Icono">
                <div>
                    <p class="small text-muted mb-0">Solicitudes portal</p>
                    <p class="h5 fw-bold mb-0">12</p>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <div class="card p-2 d-flex flex-row align-items-center">
                <img src="assets/icons/outline/building-office.svg" class="me-2" style="width: 24px; height: 24px;"
                    alt="Icono">
                <div>
                    <p class="small text-muted mb-0">Donaciones</p>
                    <p class="h5 fw-bold mb-0">7</p>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <div class="card p-2 d-flex flex-row align-items-center">
                <img src="assets/icons/outline/book-open.svg" class="me-2" style="width: 24px; height: 24px;"
                    alt="Icono">
                <div>
                    <p class="small text-muted mb-0">Régimenes</p>
                    <p class="h5 fw-bold mb-0">5</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Gráficas principales -->
    <div class="row g-3 mt-3">

        <div class="col-12 col-lg-6">
            <div class="card p-3 h-100">
                <h2 class="h5 fw-bold mb-3">Fideicomisos - Tendencia</h2>
                <div class="chart-container">
                    <canvas baseChart [type]="'line'" [data]="lineChartData" [options]="lineChartOptions"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card p-3 h-100">
                <h2 class="h5 fw-bold mb-3 text-dark">Distribución de Inmuebles</h2>
                <div class="chart-container">
                    <canvas baseChart [type]="'doughnut'" [data]="doughnutChartData"
                        [options]="doughnutChartOptions"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card p-3 h-100">
                <h2 class="h5 fw-bold mb-3 text-dark">Uso de inmuebles</h2>
                <div class="chart-container">
                    <canvas baseChart [type]="'pie'" [data]="pieChartData" [options]="pieChartOptions"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card p-3 h-100">
                <h2 class="h5 fw-bold mb-3 text-dark">Comparativa de desempeño</h2>
                <div class="chart-container">
                    <canvas baseChart [type]="'radar'" [data]="radarChartData" [options]="radarChartOptions"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Botones de acción -->
    <div class="row g-2 mt-3">
        <div class="col-12 col-sm-6 col-md-4">
            <button type="button" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2"
                (click)="enviarInmueble()">
                <img src="assets/icons/outline/plus.svg" style="width: 20px; height: 20px;" alt="Icono">
                <span>Nuevo Inmueble</span>
            </button>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
            <button type="button" class="btn w-100 d-flex align-items-center justify-content-center gap-2"
                style="background-color: #198754; color: white;">
                <img src="assets/icons/outline/check-circle.svg" style="width: 20px; height: 20px;" alt="Icono">
                <span>Aprobar Solicitud</span>
            </button>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
            <button type="button" class="btn w-100 d-flex align-items-center justify-content-center gap-2"
                style="background-color: #ffc107; color: white;">
                <img src="assets/icons/outline/eye.svg" style="width: 20px; height: 20px;" alt="Icono">
                <span>Ver Consultas</span>
            </button>
        </div>
    </div>

</div>
