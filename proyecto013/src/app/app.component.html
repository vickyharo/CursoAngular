<h1>18 - Servicios: recuperación de datos de un servidor web</h1>

<h2>Tabla ejemplo del curso</h2>
<div *ngIf="articulos!=null; else espera">
  <table border="1">
    <tr>
      <td>Codigo</td><td>Descripcion</td><td>Precio</td>
    </tr>
    <tr *ngFor="let art of articulos">
      <td>{{art.codigo}}</td>
      <td>{{art.descripcion}}</td>
      <td>{{art.precio}}</td>
    </tr>
  </table>
</div>
<ng-template #espera>Esperando datos...</ng-template>

<h2>Tabla ejemplo de Bansi</h2>
<div *ngIf="naturalezas!=null; else espera">
  <table border="1">
    <tr>
      <td>Clave</td><td>Descripcion</td>
    </tr>
    <tr *ngFor="let item of naturalezas.operationResultItem">
      <td>{{item.claveNaturaleza}}</td>
      <td>{{item.descripcionNaturaleza}}</td>
    </tr>
  </table>
</div>
<ng-template #espera>Esperando datos...</ng-template>
