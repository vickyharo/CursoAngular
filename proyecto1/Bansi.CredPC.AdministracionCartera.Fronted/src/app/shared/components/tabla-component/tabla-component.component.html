<div class="table-container" (click)="closeAllDropdowns()" [ngClass]="{ 'modal-selection': !showActionButtons,
     'highlighted': isHighlighted,
     'pagina-elementos': elementosPagina  }">
  <div class="action-buttons" *ngIf="!isHighlighted">
    <button mat-button class="action-btn" (click)="onCreateButton()" *ngIf="!isConsultaRoute && showActionButtons">
      <mat-icon class="add-button">add</mat-icon>
      <span>Crear </span>
    </button>
    <div class="additional-actions" *ngIf="showActionButtons">
      <button mat-icon-button class="icon-btn" (click)="exportData()" *ngIf="!isConsultaRoute"
        tooltipClass="button-tooltip">
        <img src="assets/file-excel-regular.svg" alt="Icon 1" class="action-icon">
      </button>
      <button mat-icon-button class="icon-btn" *ngIf="!isConsultaRoute" tooltipClass="button-tooltip">
        <img src="assets/file-pdf-regular.svg" alt="Icon 2" class="action-icon">
      </button>
      <button mat-icon-button class="icon-btn" (click)="hasAnyActiveFilters() ? clearAllFilters() : null"
        tooltipClass="button-tooltip">
        <mat-icon class="filter-button">
          {{ hasAnyActiveFilters() ? 'filter_alt_off' : 'filter_alt' }}
        </mat-icon>
      </button>

    </div>
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort class="compact-table">
      <ng-container *ngFor="let column of visibleColumns">
        <ng-container [matColumnDef]="column">
          <th mat-header-cell *matHeaderCellDef class="header-cell">
            <span>{{ formatColumnName(column) }}</span>
            <div class="column-header">
              <div class="header-title">
                <button class="dropdown-toggle-btn" (click)="toggleDropdown(column, $event)"
                  [class.active-filter]="hasActiveFilters(column)">
                  <mat-icon class="filter-icon">{{ hasActiveFilters(column) ? 'filter_alt_off' : 'filter_alt'
                    }}</mat-icon>
                </button>
              </div>
              <div class="filter-container" (click)="$event.stopPropagation()">
                <div class="filter-input-wrapper">
                </div>

                <div class="dropdown-list" *ngIf="dropdownStates[column]">
                  <ng-container *ngIf="filterType[column] === 'list'">
                    <div class="filter-input-wrapper">
                      <input type="text" [placeholder]="formatColumnName(column)" [(ngModel)]="searchText[column]"
                        (input)="updateSearchText(column, searchText[column])" class="column-filter">
                      <button *ngIf="searchText[column] || selectedFilters[column]?.length" class="clear-filter-btn"
                        (click)="clearFilter(column, $event)">
                        <mat-icon>close</mat-icon>
                      </button>
                    </div>
                    <div class="select-all-wrapper">
                      <mat-checkbox [checked]="selectAllState[column]" (change)="toggleSelectAll(column)"
                        (click)="$event.stopPropagation()">
                        Seleccionar todo
                      </mat-checkbox>
                    </div>
                    <div class="dropdown-scroll">
                      <div *ngIf="filteredValues[column]?.length === 0" class="no-results">
                        Sin coincidencias
                      </div>
                      <div class="dropdown-item" *ngFor="let value of filteredValues[column]">
                        <mat-checkbox [checked]="isOptionSelected(column, value)"
                          (change)="toggleFilterOption(column, value)" (click)="$event.stopPropagation()">
                          {{ value }}
                        </mat-checkbox>
                      </div>
                    </div>
                  </ng-container>

                  <ng-container *ngIf="filterType[column] === 'range-date'">
                    <div class="range-filter">
                      <div class="date-filter-row">
                        <label>Desde:</label>
                        <input type="date" [(ngModel)]="rangeFilters[column].min" (change)="applyRangeFilter(column)"
                          class="column-filter">
                      </div>
                      <div class="date-filter-row">
                        <label>Hasta:</label>
                        <input type="date" [(ngModel)]="rangeFilters[column].max" (change)="applyRangeFilter(column)"
                          class="column-filter">
                      </div>
                      <div class="date-filter-row" *ngIf="rangeFilters[column].min || rangeFilters[column].max">
                        <button class="clear-filter-btn" (click)="clearFilter(column, $event)">
                          <mat-icon>close</mat-icon>
                        </button>
                      </div>
                    </div>
                  </ng-container>
                  <ng-container *ngIf="filterType[column] === 'range-number'">
                    <div class="range-filter">
                      <div class="number-filter-row">
                        <label>Desde:</label>
                        <input type="text" name="min" [(ngModel)]="rangeFilters[column].min"
                          (input)="formatNumberInput($event, column)" class="column-filter">
                      </div>
                      <div class="number-filter-row">
                        <label>Hasta:</label>
                        <input type="text" name="max" [(ngModel)]="rangeFilters[column].max"
                          (input)="formatNumberInput($event, column)" class="column-filter">
                      </div>
                      <div class="date-filter-row" *ngIf="rangeFilters[column].min || rangeFilters[column].max">
                        <button class="clear-filter-btn" (click)="clearFilter(column, $event)">
                          <mat-icon>close</mat-icon>
                        </button>
                      </div>
                    </div>
                  </ng-container>
                </div>
              </div>
            </div>
          </th>
          <td mat-cell *matCellDef="let element" (click)="isVisibility(element)" class="selectedRow">
            <ng-container [ngSwitch]="true">
              <span *ngSwitchDefault>
                <ng-container *ngIf="column === 'activo'">
                  <mat-checkbox [checked]="element[column]" [disabled]="true">
                  </mat-checkbox>
                </ng-container>
                <ng-container *ngIf="column != 'activo'">
                  {{ element[column] ? element[column] : 'N/A' }}
                </ng-container>
              </span>
            </ng-container>
          </td>
        </ng-container>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="visibleColumns;"></tr>
      <tr mat-row *matRowDef="let row; columns: visibleColumns" (click)="onSelectRow(row)"
        [class.selected-row]="row === selectedRow">
      </tr>
    </table>
  </div>

  <div class="custom-paginator" *ngIf="!isHighlighted">
    <mat-paginator [length]="totalElements" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
      [pageIndex]="currentPage" showFirstLastButtons aria-label="Select page" (page)="onPageChange($event)"
      class="accent-paginator">
    </mat-paginator>
    <div class="page-numbers">
      <button *ngFor="let page of pages" [class.active]="page === currentPage" (click)="goToPage(page)"
        class="page-number-btn">
        {{ page + 1 }}
      </button>
    </div>
    <div class="elements-page" *ngIf="!elementosPagina">
      <span>Elementos por página</span>
    </div>
  </div>
</div>
